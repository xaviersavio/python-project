name: cicd

on:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::6}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t xaviersavio1978/python-app:${{ steps.vars.outputs.sha_short }} .
          docker tag xaviersavio1978/python-app:${{ steps.vars.outputs.sha_short }} xaviersavio1978/python-app:latest

      - name: Push image
        run: |
          docker push xaviersavio1978/python-app:${{ steps.vars.outputs.sha_short }}
          docker push xaviersavio1978/python-app:latest

      # ✅ THIS replaces your entire CD job
      - name: Update Kubernetes manifest
        run: |
          sed -i "s|image: .*|image: xaviersavio1978/python-app:${{ steps.vars.outputs.sha_short }}|" k8s/deployment.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name "ci-bot"
          git config --global user.email "ci@example.com"
          git add k8s/deployment.yaml
          git commit -m "Update image to ${{ steps.vars.outputs.sha_short }}" || echo "No changes"
          git push