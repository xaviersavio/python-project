name: cicd

on:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::6}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (lightweight)
        run: |
          docker build -t xaviersavio1978/python-app:${GITHUB_SHA::6} .

      - name: Push image
        run: |
          docker push xaviersavio1978/python-app:${GITHUB_SHA::6}

  cd:
    needs: ci
    runs-on: self-hosted
   
    steps:
      - name: Install Argo CD CLI
        run: |
         curl -sSL -o argocd \
          https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
         chmod +x argocd
         sudo mv argocd /usr/local/bin/

      - name: Verify ArgoCD CLI
        run: argocd version

      - name: argocd app sync
        shell: bash
        run: |
           argocd login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username admin \
            --password   ${{ secrets.ARGOCD_PASSWORD }}
           argocd app sync python-app 