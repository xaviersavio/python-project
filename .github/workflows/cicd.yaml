name: cicd

on:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::6}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (lightweight)
        run: |
          docker build -t xaviersavio1978/python-app:${GITHUB_SHA::6} .

      - name: Push image
        run: |
          docker push xaviersavio1978/python-app:${GITHUB_SHA::6}

  cd:
    needs: ci
    runs-on: self-hosted
   
    steps:
      - name: argocd app sync
        shell: bash
        run: |
          set -e
          kubectl port-forward svc/argocd-server -n argocd 8080:443 > /tmp/port-forward.log 2>&1 &
    

          for i in {1..20}; do
          nc -z localhost 8080 && echo "Port-forward ready" && break
          echo "Waiting for port-forward..."
          sleep 2



          argocd login localhost:8080 \
          --insecure \
          --grpc-web \
          --username admin \
          --password ${{ secrets.ARGOCD_PASSWORD }}


          argocd app sync python-app